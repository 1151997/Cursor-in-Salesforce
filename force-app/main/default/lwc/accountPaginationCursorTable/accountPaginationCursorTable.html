<template>
    <lightning-card title="Cursor Account Table" icon-name="standard:account">
        <div class="slds-m-around_medium">
            <div style="height: 400px;">
                <lightning-datatable
                    key-field="Id"
                    data={accounts}
                    columns={columns}
                    hide-checkbox-column
                ></lightning-datatable>
            </div>

            <div class="slds-m-top_medium slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <div>
                    Total Rows: <strong>{totalRecords}</strong> | Page Size: <strong>{pageSize}</strong> | Current Index: <strong>{position}</strong>
                </div>
                <lightning-button
                    label="Previous"
                    onclick={handlePrevious}
                    disabled={isPreviousDisabled}
                ></lightning-button>
                <lightning-button
                    label="Next"
                    onclick={handleNext}
                    disabled={isNextDisabled}
                ></lightning-button>

            </div>
        </div>
    </lightning-card>
</template>
